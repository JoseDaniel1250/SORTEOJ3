<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sorteos J3</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>


    <!-- ========================= -->
    <!-- HOME -->
    <!-- ========================= -->

    <div class="app">

        <!-- LOGO -->

        <img
            src="LOGO.png"
            alt="Sorteos J3"
            class="logo">


        <!-- PREMIO -->

        <div class="premio-frame">

    <img
        id="premioImagen"
        src="PREMIO.png"
        class="premio-img">

</div>

<div
    id="premioNombre"
    class="premio-nombre">

    Cargando premio...

</div>

<div
    id="premioFecha"
    class="premio-nombre">

    Cargando fecha...

</div>

<div
    id="premioPrecio"
    class="premio-nombre">

    Cargando precio...

</div>

</div>

        <!-- BOTONES -->

        <div class="menu-principal">

    <img
        src="B_ELEGIR.png"
        class="btn-elegir"
        onclick="accionElegir()">

    <img
        src="B_ALEATORIO.png"
        class="btn-aleatorio"
        onclick="accionAleatorio()">

</div>
    </div>


    <!-- ========================= -->
    <!-- MODAL -->
    <!-- ========================= -->

    <div id="modal" class="modal hidden">

        <div class="modal-content">

            <h2>

                Número de oportunidades

            </h2>

            <input
                id="cantidad"
                type="number"
                min="1"
                placeholder="Ej: 5">


            <div class="modal-buttons">

                <button onclick="confirmar()">

                    Confirmar

                </button>


                <button onclick="cerrarModal()">

                    Cancelar

                </button>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- RESULTADOS -->
    <!-- ========================= -->

    <div
        id="resultados"
        class="resultados hidden">

        <h2>

            Tus números

        </h2>


        <div
            id="listaNumeros"
            class="numeros">

        </div>


        <div class="acciones-resultados">

    <img
        src="B_PESOS.png"
        class="btn-continuar"
        onclick="accionPesos()">

    <button
        class="btn-cancelar-resultados"
        onclick="cancelarResultados()">

        Cancelar

    </button>

</div>
</div>



   <!-- ========================= -->
<!-- NUEVO SELECTOR -->
<!-- ========================= -->

<div
    id="selector"
    class="selector hidden">

    <div class="selector-header">

        <h2>

           ⭐⭐ ELIGE TU SUERTE ⭐⭐

        </h2>

        <div class="contador">

            Seleccionados:

            <span id="contadorSeleccionados">

                0

            </span>

        </div>

        <input
            type="text"
            id="buscadorNumero"
            placeholder="Buscar número..."
            maxlength="4">

    </div>


    <div
        id="panelNumeros">

    </div>


    <div class="selector-botones">

        <button
            class="btn-cancelar"
            onclick="cancelarResultados()">

            CANCELAR

        </button>


        <button
            class="btn-confirmar"
            onclick="confirmarSeleccion()">

            CONFIRMAR

        </button>

    </div>

</div>

    <script src="script.js"></script>

</body>

</html>
